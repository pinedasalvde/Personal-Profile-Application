<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Personal Profile</title>
		<style>
			body {
				background-color: pink;
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 2rem;
			}

			.title-row {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				flex-wrap: wrap;
			}

			.title-row img {
				width: 100px;
				height: 100px;
				object-fit: cover;
			}

			main,
			header {
				max-width: 700px;
				margin: 0 auto;
			}

			form {
				display: grid;
				gap: 0.5rem;
				max-width: 420px;
			}

			input,
			textarea,
			button {
				font: inherit;
				padding: 0.75rem;
			}

			input[type="color"] {
				padding: 0.2rem;
				height: 3rem;
			}

			button {
				border: none;
				border-radius: 6px;
				background: #d6336c;
				color: white;
				cursor: pointer;
				transition: background 0.2s;
			}

			button:hover {
				background: #a61e4d;
			}

			button.secondary {
				background: #6c757d;
			}

			.field-error,
			#form-error {
				color: darkred;
				font-size: 0.9rem;
				margin: 0;
			}

			.invalid {
				outline: 2px solid darkred;
			}

			#greeting {
				font-weight: bold;
			}

			#profile-list {
				display: grid;
				gap: 1rem;
				padding: 0;
				list-style: none;
			}

			.profile-card {
				background: white;
				border-radius: 8px;
				border-left: 8px solid var(--accent, hotpink);
				padding: 1rem;
				box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
				transition: transform 0.2s;
			}

			.profile-card:hover {
				transform: translateY(-3px);
			}

			.profile-card h3 {
				margin: 0 0 0.5rem;
			}

			.profile-card p {
				margin: 0.25rem 0;
			}

			.profile-card img {
				width: 80px;
				height: 80px;
				border-radius: 50%;
				object-fit: cover;
				float: right;
			}

			.profile-card blockquote {
				margin: 0.5rem 0;
				font-style: italic;
			}

			.card-actions {
				display: flex;
				gap: 0.5rem;
				margin-top: 0.5rem;
			}

			.card-actions button {
				padding: 0.4rem 0.8rem;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="title-row">
				<h1>All About Me</h1>
				<img src="https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyemx3NWFma29idjV3cG85MGd0NnFwc2Ntb3d0ZWgwNGZsMGZ5dmc3NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/a45i4PSgJpxHCVY5IM/200w.gif" alt="Animated profile GIF" />
			</div>
			<p>Create and view your personal profile.</p>
		</header>

		<main>
			<section aria-labelledby="input-heading">
				<h2 id="input-heading">Profile Information</h2>
				<form id="profile-form" novalidate>
					<label for="name">Name</label>
					<input id="name" name="name" type="text" />
					<p class="field-error" data-error-for="name"></p>

					<label for="age">Age</label>
					<input id="age" name="age" type="number" min="1" max="120" />
					<p class="field-error" data-error-for="age"></p>

					<label for="email">Email</label>
					<input id="email" name="email" type="email" />
					<p class="field-error" data-error-for="email"></p>

					<label for="bio">Bio</label>
					<textarea id="bio" name="bio" rows="4"></textarea>
					<p class="field-error" data-error-for="bio"></p>

					<label for="photo">Photo URL (optional)</label>
					<input id="photo" name="photo" type="url" placeholder="https://..." />
					<p class="field-error" data-error-for="photo"></p>

					<label for="hometown">Hometown</label>
					<input id="hometown" name="hometown" type="text" />

					<label for="hobbies">Hobbies (comma separated)</label>
					<input id="hobbies" name="hobbies" type="text" />

					<label for="color">Favorite color</label>
					<input id="color" name="color" type="color" value="#ff69b4" />

					<label for="quote">Favorite quote</label>
					<input id="quote" name="quote" type="text" />

					<button type="submit" id="submit-btn">Save this Profile</button>
					<button type="button" id="cancel-btn" class="secondary" hidden>Cancel editing</button>
					<p id="form-error" role="alert"></p>
				</form>
			</section>

			<section aria-labelledby="profiles-heading">
				<h2 id="profiles-heading">Saved Profiles</h2>
				<p id="greeting" role="status"></p>
				<ul id="profile-list"></ul>
			</section>
		</main>

		<script>
			/* ---------- Data (source of truth) ---------- */
			// Every profile shown on the page comes from this array.
			// Changes are made to the array first, then the DOM is re-rendered from it.
			const STORAGE_KEY = "profiles";
			const defaultProfiles = [
				{
					name: "Sample User",
					age: 25,
					email: "sample@example.com",
					bio: "Hello! This is a sample profile.",
					photo: "",
					hometown: "Manila",
					hobbies: ["reading", "music"],
					color: "#ff69b4",
					quote: "Be yourself.",
				},
			];

			// Load saved profiles from localStorage, falling back to the defaults.
			function loadProfiles() {
				try {
					const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
					if (Array.isArray(saved)) return saved;
				} catch (e) {
					// Corrupt or unavailable storage: use defaults.
				}
				return defaultProfiles;
			}

			function saveProfiles() {
				try {
					localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
				} catch (e) {
					// Storage unavailable: the page still works for this session.
				}
			}

			const profiles = loadProfiles();
			// Index of the profile being edited, or null when adding a new one.
			let editingIndex = null;

			/* ---------- DOM references ---------- */
			const form = document.getElementById("profile-form");
			const list = document.getElementById("profile-list");
			const formError = document.getElementById("form-error");
			const greetingEl = document.getElementById("greeting");
			const submitBtn = document.getElementById("submit-btn");
			const cancelBtn = document.getElementById("cancel-btn");

			/* ---------- Rendering ---------- */
			// Append a "Label: value" paragraph to a card (skipped when empty).
			// textContent is used so user input can never inject HTML.
			function addLine(card, label, value) {
				if (!value) return;
				const p = document.createElement("p");
				p.textContent = label + value;
				card.append(p);
			}

			// Rebuild the whole profile list from the array.
			function renderProfiles() {
				list.replaceChildren();

				if (profiles.length === 0) {
					const empty = document.createElement("li");
					empty.textContent = "No profiles yet.";
					list.append(empty);
					return;
				}

				profiles.forEach((profile, index) => {
					const card = document.createElement("li");
					card.className = "profile-card";
					// The accent color drives the card's border through a CSS variable.
					card.style.setProperty("--accent", profile.color || "hotpink");

					if (profile.photo) {
						const img = document.createElement("img");
						img.src = profile.photo;
						img.alt = "Photo of " + profile.name;
						card.append(img);
					}

					const heading = document.createElement("h3");
					heading.textContent = profile.name;
					card.append(heading);

					addLine(card, "Age: ", profile.age);
					addLine(card, "Email: ", profile.email);
					addLine(card, "Hometown: ", profile.hometown);
					addLine(card, "Hobbies: ", (profile.hobbies || []).join(", "));
					addLine(card, "", profile.bio);

					if (profile.quote) {
						const quote = document.createElement("blockquote");
						quote.textContent = "\u201C" + profile.quote + "\u201D";
						card.append(quote);
					}

					const actions = document.createElement("div");
					actions.className = "card-actions";

					const editBtn = document.createElement("button");
					editBtn.type = "button";
					editBtn.textContent = "Edit";
					// Edit: copy this profile's values back into the form.
					editBtn.addEventListener("click", () => startEditing(index));

					const delBtn = document.createElement("button");
					delBtn.type = "button";
					delBtn.className = "secondary";
					delBtn.textContent = "Delete";
					// Delete: remove from the array, persist, then re-render.
					delBtn.addEventListener("click", () => {
						profiles.splice(index, 1);
						stopEditing();
						saveProfiles();
						greetingEl.textContent = "";
						renderProfiles();
					});

					actions.append(editBtn, delBtn);
					card.append(actions);
					list.append(card);
				});
			}

			/* ---------- Editing ---------- */
			function startEditing(index) {
				const p = profiles[index];
				clearErrors();
				editingIndex = index;
				form.elements.name.value = p.name;
				form.elements.age.value = p.age;
				form.elements.email.value = p.email;
				form.elements.bio.value = p.bio;
				form.elements.photo.value = p.photo || "";
				form.elements.hometown.value = p.hometown || "";
				form.elements.hobbies.value = (p.hobbies || []).join(", ");
				form.elements.color.value = p.color || "#ff69b4";
				form.elements.quote.value = p.quote || "";
				submitBtn.textContent = "Update Profile";
				cancelBtn.hidden = false;
				form.scrollIntoView({ behavior: "smooth" });
			}

			// Return the form to "add new profile" mode.
			function stopEditing() {
				editingIndex = null;
				form.reset();
				submitBtn.textContent = "Save this Profile";
				cancelBtn.hidden = true;
				clearErrors();
			}

			/* ---------- Validation ---------- */
			function clearErrors() {
				formError.textContent = "";
				form.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
				form.querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
			}

			function showError(field, message) {
				form.querySelector('[data-error-for="' + field + '"]').textContent = message;
				form.elements[field].classList.add("invalid");
			}

			function isHttpUrl(value) {
				try {
					const url = new URL(value);
					return url.protocol === "http:" || url.protocol === "https:";
				} catch (e) {
					return false;
				}
			}

			// Show inline errors for each bad field; returns true when everything is valid.
			function validate(profile) {
				clearErrors();
				let valid = true;
				const fail = (field, message) => {
					showError(field, message);
					valid = false;
				};

				if (profile.name.length < 2 || profile.name.length > 50) {
					fail("name", "Name must be 2-50 characters.");
				}
				if (!Number.isInteger(profile.age) || profile.age < 1 || profile.age > 120) {
					fail("age", "Age must be a whole number from 1 to 120.");
				}
				if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(profile.email)) {
					fail("email", "Enter a valid email address.");
				} else if (
					profiles.some(
						(p, i) => i !== editingIndex && p.email.toLowerCase() === profile.email.toLowerCase()
					)
				) {
					fail("email", "A profile with this email already exists.");
				}
				if (profile.bio.length < 10 || profile.bio.length > 300) {
					fail("bio", "Bio must be 10-300 characters.");
				}
				if (profile.photo && !isHttpUrl(profile.photo)) {
					fail("photo", "Photo must be a valid http(s) URL.");
				}
				if (!valid) formError.textContent = "Please fix the highlighted fields.";
				return valid;
			}

			/* ---------- Event handling ---------- */
			// Add or update a profile without reloading the page.
			form.addEventListener("submit", (event) => {
				event.preventDefault();
				const data = new FormData(form);
				const profile = {
					name: data.get("name").trim(),
					age: Number(data.get("age")),
					email: data.get("email").trim(),
					bio: data.get("bio").trim(),
					photo: data.get("photo").trim(),
					hometown: data.get("hometown").trim(),
					hobbies: data
						.get("hobbies")
						.split(",")
						.map((h) => h.trim())
						.filter(Boolean),
					color: data.get("color"),
					quote: data.get("quote").trim(),
				};

				if (!validate(profile)) return;

				// Update the array first (the source of truth)...
				if (editingIndex === null) {
					profiles.push(profile);
					greetingEl.textContent = "Welcome, " + profile.name + "! Your profile was saved.";
				} else {
					profiles[editingIndex] = profile;
					greetingEl.textContent = "Updated " + profile.name + "'s profile.";
				}
				saveProfiles();
				// ...then re-render the page from it.
				renderProfiles();
				stopEditing();
			});

			cancelBtn.addEventListener("click", stopEditing);

			// Clear a field's error as soon as the user edits it.
			form.addEventListener("input", (event) => {
				event.target.classList.remove("invalid");
				const err = form.querySelector('[data-error-for="' + event.target.name + '"]');
				if (err) err.textContent = "";
			});

			renderProfiles();
		</script>
	</body>
</html>
