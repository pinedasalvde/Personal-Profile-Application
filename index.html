<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Personal Profile</title>
		<style>
			:root {
				color-scheme: light;
				font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #20233a;
				background: #f5f6fb;
				font-synthesis: none;
				text-rendering: optimizeLegibility;
				--accent: #6c5ce7;
				--muted: #6f7285;
				--border: #e6e7ef;
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-width: 320px;
				margin: 0;
				padding: clamp(1rem, 4vw, 3rem);
				background:
					radial-gradient(ellipse at 12% 0%, #e8e4ff 0, transparent 34rem),
					#f5f6fb;
			}

			header,
			main {
				width: min(100%, 1080px);
				margin: 0 auto;
			}

			header {
				padding: clamp(1rem, 3vw, 2rem) 0 1.5rem;
			}

			.eyebrow {
				margin: 0 0 0.5rem;
				color: var(--accent);
				font-size: 0.75rem;
				font-weight: 800;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}

			h1,
			h2,
			h3,
			p {
				overflow-wrap: anywhere;
			}

			h1 {
				margin: 0;
				font-size: clamp(2rem, 6vw, 3.25rem);
				letter-spacing: -0.05em;
			}

			header > p:last-child {
				margin: 0.75rem 0 0;
				color: var(--muted);
				font-size: 1.05rem;
			}

			main {
				display: grid;
				grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr);
				align-items: start;
				gap: 1.25rem;
			}

			section {
				min-width: 0;
				padding: clamp(1rem, 3vw, 1.5rem);
				border: 1px solid var(--border);
				border-radius: 18px;
				background: rgba(255, 255, 255, 0.9);
				box-shadow: 0 12px 35px rgba(36, 38, 72, 0.06);
			}

			h2 {
				margin: 0 0 1.25rem;
				font-size: 1.25rem;
				letter-spacing: -0.02em;
			}

			form {
				display: grid;
				gap: 0.55rem;
			}

			label {
				margin-top: 0.35rem;
				font-size: 0.9rem;
				font-weight: 650;
			}

			input,
			textarea,
			button {
				width: 100%;
				font: inherit;
			}

			input,
			textarea {
				min-width: 0;
				padding: 0.75rem 0.85rem;
				border: 1px solid #d9dbe6;
				border-radius: 10px;
				background: #fff;
				color: inherit;
			}

			input:focus,
			textarea:focus {
				border-color: var(--accent);
				outline: 3px solid rgba(108, 92, 231, 0.16);
			}

			input[type="color"] {
				height: 3rem;
				padding: 0.3rem;
			}

			textarea {
				resize: vertical;
			}

			button {
				min-height: 2.75rem;
				padding: 0.7rem 0.9rem;
				border: 0;
				border-radius: 10px;
				background: var(--accent);
				color: white;
				font-weight: 700;
				cursor: pointer;
				transition: transform 0.15s ease, background 0.15s ease;
			}

			button:hover {
				transform: translateY(-1px);
				background: #5545cc;
			}

			button:focus-visible {
				outline: 3px solid #b6adff;
				outline-offset: 2px;
			}

			button.secondary {
				background: #eef0f6;
				color: #393c52;
			}

			button.secondary:hover {
				background: #e1e4ee;
			}

			.field-error,
			#form-error {
				min-height: 0;
				margin: 0;
				color: #b42318;
				font-size: 0.82rem;
			}

			.invalid {
				border-color: #b42318;
			}

			#greeting {
				margin: -0.5rem 0 1rem;
				color: var(--muted);
				font-size: 0.9rem;
			}

			#profile-list {
				display: grid;
				gap: 1rem;
				margin: 0;
				padding: 0;
				list-style: none;
			}

			.profile-card {
				position: relative;
				min-width: 0;
				padding: 1.25rem;
				border: 1px solid var(--border);
				border-top: 4px solid var(--accent, #6c5ce7);
				border-radius: 14px;
				background: #fff;
			}

			.profile-card h3 {
				margin: 0 5.5rem 0.75rem 0;
				font-size: 1.2rem;
			}

			.profile-card p {
				margin: 0.4rem 0;
				color: var(--muted);
				line-height: 1.5;
			}

			.profile-card img {
				float: right;
				width: 4.5rem;
				height: 4.5rem;
				margin: 0 0 0.75rem 1rem;
				border-radius: 50%;
				object-fit: cover;
				background: #f0efff;
			}

			.profile-card blockquote {
				margin: 1rem 0 0;
				padding-left: 0.9rem;
				border-left: 3px solid var(--accent, #6c5ce7);
				color: #46495e;
				font-style: italic;
			}

			.card-actions {
				display: flex;
				gap: 0.6rem;
				margin-top: 1rem;
			}

			.card-actions button {
				width: auto;
				min-height: 2.35rem;
				padding: 0.45rem 0.85rem;
				font-size: 0.88rem;
			}

			@media (max-width: 760px) {
				main {
					grid-template-columns: 1fr;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				* {
					scroll-behavior: auto !important;
					transition-duration: 0.01ms !important;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<p class="eyebrow">Personal profile studio</p>
			<h1>All About Me</h1>
			<p>Create, update, and keep your profiles saved in this browser.</p>
		</header>

		<main>
			<section aria-labelledby="input-heading">
				<h2 id="input-heading">Profile Information</h2>
				<form id="profile-form" novalidate>
					<label for="name">Name</label>
					<input id="name" name="name" type="text" autocomplete="name" maxlength="50" />
					<p class="field-error" data-error-for="name"></p>

					<label for="age">Age</label>
					<input id="age" name="age" type="number" min="1" max="120" step="1" />
					<p class="field-error" data-error-for="age"></p>

					<label for="email">Email</label>
					<input id="email" name="email" type="email" autocomplete="email" />
					<p class="field-error" data-error-for="email"></p>

					<label for="bio">Bio</label>
					<textarea id="bio" name="bio" rows="4" maxlength="300"></textarea>
					<p class="field-error" data-error-for="bio"></p>

					<label for="photo">Photo URL (optional)</label>
					<input id="photo" name="photo" type="url" placeholder="https://..." inputmode="url" />
					<p class="field-error" data-error-for="photo"></p>

					<label for="hometown">Hometown</label>
					<input id="hometown" name="hometown" type="text" />

					<label for="hobbies">Hobbies (comma separated)</label>
					<input id="hobbies" name="hobbies" type="text" />

					<label for="color">Favorite color</label>
					<input id="color" name="color" type="color" value="#ff69b4" />

					<label for="quote">Favorite quote</label>
					<input id="quote" name="quote" type="text" />

					<button type="submit" id="submit-btn">Save this Profile</button>
					<button type="button" id="cancel-btn" class="secondary" hidden>Cancel editing</button>
					<p id="form-error" role="alert"></p>
				</form>
			</section>

			<section aria-labelledby="profiles-heading">
				<h2 id="profiles-heading">Saved Profiles</h2>
				<p id="greeting" role="status" aria-live="polite"></p>
				<ul id="profile-list"></ul>
			</section>
		</main>

		<script>
			/* ---------- Data (source of truth) ---------- */
			// Every profile shown on the page comes from this array.
			// Changes are made to the array first, then the DOM is re-rendered from it.
			const STORAGE_KEY = "profiles";
			const defaultProfiles = [
				{
					name: "Sample User",
					age: 25,
					email: "sample@example.com",
					bio: "Hello! This is a sample profile.",
					photo: "",
					hometown: "Manila",
					hobbies: ["reading", "music"],
					color: "#ff69b4",
					quote: "Be yourself.",
				},
			];
			let storageWarning = "";

			// Load saved profiles from localStorage, falling back to the defaults.
			function loadProfiles() {
				let saved;
				try {
					const raw = localStorage.getItem(STORAGE_KEY);
					if (raw === null) return defaultProfiles.map((profile) => ({ ...profile }));
					saved = JSON.parse(raw);
				} catch {
					storageWarning = "Saved profiles could not be read. The sample profile is shown for this visit.";
					return defaultProfiles.map((profile) => ({ ...profile }));
				}

				if (!Array.isArray(saved)) {
					storageWarning = "Saved profile data was invalid. The sample profile is shown for this visit.";
					return defaultProfiles.map((profile) => ({ ...profile }));
				}

				return saved
					.filter((profile) => profile && typeof profile === "object" && typeof profile.name === "string" && typeof profile.email === "string")
					.map((profile) => ({
						...profile,
						hobbies: Array.isArray(profile.hobbies) ? profile.hobbies.filter((hobby) => typeof hobby === "string") : [],
						color: /^#[\da-f]{6}$/i.test(profile.color) ? profile.color : "#ff69b4",
					}));
			}

			function saveProfiles() {
				try {
					localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
					return true;
				} catch {
					return false;
				}
			}

			const profiles = loadProfiles();
			// Index of the profile being edited, or null when adding a new one.
			let editingIndex = null;

			/* ---------- DOM references ---------- */
			const form = document.getElementById("profile-form");
			const list = document.getElementById("profile-list");
			const formError = document.getElementById("form-error");
			const greetingEl = document.getElementById("greeting");
			const submitBtn = document.getElementById("submit-btn");
			const cancelBtn = document.getElementById("cancel-btn");
			if (storageWarning) greetingEl.textContent = storageWarning;

			/* ---------- Rendering ---------- */
			// Append a "Label: value" paragraph to a card (skipped when empty).
			// textContent is used so user input can never inject HTML.
			function addLine(card, label, value) {
				if (!value) return;
				const p = document.createElement("p");
				p.textContent = label + value;
				card.append(p);
			}

			// Rebuild the whole profile list from the array.
			function renderProfiles() {
				list.replaceChildren();

				if (profiles.length === 0) {
					const empty = document.createElement("li");
					empty.textContent = "No profiles yet.";
					list.append(empty);
					return;
				}

				profiles.forEach((profile, index) => {
					const card = document.createElement("li");
					card.className = "profile-card";
					// The accent color drives the card's border through a CSS variable.
					card.style.setProperty("--accent", profile.color || "hotpink");

					if (profile.photo) {
						const img = document.createElement("img");
						img.src = profile.photo;
						img.alt = "Photo of " + profile.name;
						img.addEventListener("error", () => img.remove(), { once: true });
						card.append(img);
					}

					const heading = document.createElement("h3");
					heading.textContent = profile.name;
					card.append(heading);

					addLine(card, "Age: ", profile.age);
					addLine(card, "Email: ", profile.email);
					addLine(card, "Hometown: ", profile.hometown);
					addLine(card, "Hobbies: ", (profile.hobbies || []).join(", "));
					addLine(card, "", profile.bio);

					if (profile.quote) {
						const quote = document.createElement("blockquote");
						quote.textContent = "\u201C" + profile.quote + "\u201D";
						card.append(quote);
					}

					const actions = document.createElement("div");
					actions.className = "card-actions";

					const editBtn = document.createElement("button");
					editBtn.type = "button";
					editBtn.textContent = "Edit";
					// Edit: copy this profile's values back into the form.
					editBtn.addEventListener("click", () => startEditing(index));

					const delBtn = document.createElement("button");
					delBtn.type = "button";
					delBtn.className = "secondary";
					delBtn.textContent = "Delete";
					// Delete: remove from the array, persist, then re-render.
					delBtn.addEventListener("click", () => {
						profiles.splice(index, 1);
						stopEditing();
						greetingEl.textContent = saveProfiles()
							? ""
							: "Your change is active for this visit, but the browser could not save it.";
						renderProfiles();
					});

					actions.append(editBtn, delBtn);
					card.append(actions);
					list.append(card);
				});
			}

			/* ---------- Editing ---------- */
			function startEditing(index) {
				const p = profiles[index];
				clearErrors();
				editingIndex = index;
				form.elements.name.value = p.name;
				form.elements.age.value = p.age;
				form.elements.email.value = p.email;
				form.elements.bio.value = p.bio;
				form.elements.photo.value = p.photo || "";
				form.elements.hometown.value = p.hometown || "";
				form.elements.hobbies.value = (p.hobbies || []).join(", ");
				form.elements.color.value = p.color || "#ff69b4";
				form.elements.quote.value = p.quote || "";
				submitBtn.textContent = "Update Profile";
				cancelBtn.hidden = false;
				form.scrollIntoView({ behavior: "smooth" });
			}

			// Return the form to "add new profile" mode.
			function stopEditing() {
				editingIndex = null;
				form.reset();
				submitBtn.textContent = "Save this Profile";
				cancelBtn.hidden = true;
				clearErrors();
			}

			/* ---------- Validation ---------- */
			function clearErrors() {
				formError.textContent = "";
				form.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
				form.querySelectorAll(".invalid").forEach((el) => el.classList.remove("invalid"));
			}

			function showError(field, message) {
				form.querySelector('[data-error-for="' + field + '"]').textContent = message;
				form.elements[field].classList.add("invalid");
			}

			function isHttpUrl(value) {
				try {
					const url = new URL(value);
					return url.protocol === "http:" || url.protocol === "https:";
				} catch (e) {
					return false;
				}
			}

			// Show inline errors for each bad field; returns true when everything is valid.
			function validate(profile) {
				clearErrors();
				let valid = true;
				const fail = (field, message) => {
					showError(field, message);
					valid = false;
				};

				if (profile.name.length < 2 || profile.name.length > 50) {
					fail("name", "Name must be 2-50 characters.");
				}
				if (!Number.isInteger(profile.age) || profile.age < 1 || profile.age > 120) {
					fail("age", "Age must be a whole number from 1 to 120.");
				}
				if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(profile.email)) {
					fail("email", "Enter a valid email address.");
				} else if (
					profiles.some(
						(p, i) => i !== editingIndex && p.email.toLowerCase() === profile.email.toLowerCase()
					)
				) {
					fail("email", "A profile with this email already exists.");
				}
				if (profile.bio.length < 10 || profile.bio.length > 300) {
					fail("bio", "Bio must be 10-300 characters.");
				}
				if (profile.photo && !isHttpUrl(profile.photo)) {
					fail("photo", "Photo must be a valid http(s) URL.");
				}
				if (!valid) formError.textContent = "Please fix the highlighted fields.";
				return valid;
			}

			/* ---------- Event handling ---------- */
			// Add or update a profile without reloading the page.
			form.addEventListener("submit", (event) => {
				event.preventDefault();
				const data = new FormData(form);
				const profile = {
					name: data.get("name").trim(),
					age: Number(data.get("age")),
					email: data.get("email").trim(),
					bio: data.get("bio").trim(),
					photo: data.get("photo").trim(),
					hometown: data.get("hometown").trim(),
					hobbies: data
						.get("hobbies")
						.split(",")
						.map((h) => h.trim())
						.filter(Boolean),
					color: data.get("color"),
					quote: data.get("quote").trim(),
				};

				if (!validate(profile)) return;

				// Update the array first (the source of truth)...
				if (editingIndex === null) {
					profiles.push(profile);
					greetingEl.textContent = "Welcome, " + profile.name + "! Your profile was saved.";
				} else {
					profiles[editingIndex] = profile;
					greetingEl.textContent = "Updated " + profile.name + "'s profile.";
				}
				const saved = saveProfiles();
				if (!saved) greetingEl.textContent = "Your change is active for this visit, but the browser could not save it.";
				// ...then re-render the page from it.
				renderProfiles();
				stopEditing();
			});

			cancelBtn.addEventListener("click", stopEditing);

			// Clear a field's error as soon as the user edits it.
			form.addEventListener("input", (event) => {
				event.target.classList.remove("invalid");
				const err = form.querySelector('[data-error-for="' + event.target.name + '"]');
				if (err) err.textContent = "";
			});

			renderProfiles();
		</script>
	</body>
</html>
